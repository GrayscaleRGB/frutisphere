<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-labelledby="title desc">
  <title id="title">Neutral tile image placeholder</title>
  <desc id="desc">A muted gray empty-state panel marking space for approved artwork.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef3f5"/>
      <stop offset="0.55" stop-color="#dce4e8"/>
      <stop offset="1" stop-color="#cbd5da"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#7d8e96" stroke-opacity=".08" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="800" height="800" rx="54" fill="url(#surface)"/>
  <rect x="2" y="2" width="796" height="796" rx="52" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="4"/>
  <rect x="24" y="24" width="752" height="752" rx="36" fill="url(#grid)" stroke="#9aa8ae" stroke-opacity=".55" stroke-width="3" stroke-dasharray="12 14"/>
  <g fill="none" stroke="#687980" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity=".72">
    <rect x="273" y="242" width="254" height="204" rx="24"/>
    <circle cx="339" cy="307" r="26"/>
    <path d="m301 409 73-72 54 49 43-40 28 28"/>
  </g>
  <text x="400" y="536" text-anchor="middle" fill="#52636a" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="2">TILE IMAGE PLACEHOLDER</text>
  <text x="400" y="582" text-anchor="middle" fill="#718087" font-family="Arial, sans-serif" font-size="23">Approved artwork will replace this asset</text>
</svg>
